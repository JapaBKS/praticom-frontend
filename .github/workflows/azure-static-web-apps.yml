# Testa, gera o build (shell + 2 remotes em dist/) e publica no Azure Static Web Apps.
# Configure no GitHub: Settings > Secrets and variables > Actions
#   secret   AZURE_STATIC_WEB_APPS_API_TOKEN  (token de implantação do Static Web App)
#   variable VITE_API_URL                     (ex.: https://praticom-gateway.azurewebsites.net/api)
name: Deploy frontend (Azure Static Web Apps)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: dist
          output_location: ''
          skip_app_build: true
